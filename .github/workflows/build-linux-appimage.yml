name: Build Linux Package

on:
  push:
    branches:
      - main
    paths:
      - 'linux_gui/src/**'
      - 'linux_gui/assets/**'
      - 'linux_gui/requirements.txt'
      - 'linux_gui/build_deb.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build .deb package
        working-directory: linux_gui
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Move package to dist
        run: |
          mkdir -p linux_gui/dist
          rm -f linux_gui/dist/*.deb
          mv linux_gui/build/*.deb linux_gui/dist/

      - name: Commit .deb to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linux_gui/dist/*.deb
          git diff --staged --quiet || git commit -m "build: update Linux .deb package [skip ci]"
          git push
