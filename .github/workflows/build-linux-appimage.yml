name: Build Linux AppImage

on:
  push:
    branches:
      - main
    paths:
      - 'linux_gui/src/**'
      - 'linux_gui/assets/**'
      - 'linux_gui/requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl file fuse libfuse2

      - name: Build AppImage
        working-directory: linux_gui
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Move AppImage to dist
        run: |
          mkdir -p linux_gui/dist
          mv linux_gui/build/*.AppImage linux_gui/dist/

      - name: Commit AppImage to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linux_gui/dist/*.AppImage
          git diff --staged --quiet || git commit -m "build: update Linux AppImage [skip ci]"
          git push
